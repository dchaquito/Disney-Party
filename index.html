<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magical Party · Tablero</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="board" aria-label="Tablero Magical Party">
  <img src="assets/tablero.png" alt="Tablero de parque de diversiones" draggable="false">
  <div id="pieces" aria-label="Fichas movibles">
    <button class="piece team t1" data-id="1" aria-label="Equipo 1">1</button>
    <button class="piece team t2" data-id="2" aria-label="Equipo 2">2</button>
    <button class="piece team t3" data-id="3" aria-label="Equipo 3">3</button>
    <button class="piece team t4" data-id="4" aria-label="Equipo 4">4</button>
    <button class="piece team t5" data-id="5" aria-label="Equipo 5">5</button>
    <button class="piece team t6" data-id="6" aria-label="Equipo 6">6</button>
    <button class="piece team t7" data-id="7" aria-label="Equipo 7">7</button>
    <button class="piece team t8" data-id="8" aria-label="Equipo 8">8</button>
    <button class="piece crown" data-id="crown" aria-label="Corona">♛</button>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
